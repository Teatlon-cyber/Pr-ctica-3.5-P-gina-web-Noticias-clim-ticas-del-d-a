<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias climáticas del día</title>
    <style>
        /* Modern CSS Reset & CSS Variables */
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --primary-light: #f0fdf4;
            --accent: #059669;
            --bg-gradient: linear-gradient(135deg, #e6f4ea 0%, #f4fbf7 50%, #e8f5e9 100%);
            --text-main: #1c3d27;
            --text-muted: #4a6b53;
            --card-bg: #ffffff;
            --border-color: #c8e6c9;
            --shadow: 0 10px 25px -5px rgba(21, 128, 61, 0.1), 0 8px 10px -6px rgba(21, 128, 61, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #dcfce7;
            color: var(--primary);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid #bbf7d0;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f381e;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Card Form */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 600;
            color: #143820;
            font-size: 0.95rem;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            color: var(--text-main);
            background-color: #f9fdfa;
            border: 1.5px solid #a7f3d0;
            border-radius: 10px;
            appearance: none;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
            background-color: #ffffff;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 0.75rem;
            color: var(--primary);
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(21, 128, 61, 0.25);
        }

        button.btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        button.btn-submit:disabled {
            background-color: #86efac;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.85;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results Box */
        .results-section {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .results-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f381e;
        }

        .results-date {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent);
            background-color: var(--primary-light);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
            text-transform: capitalize;
        }

        /* Plain text result box respecting newlines */
        .news-box {
            white-space: pre-line;
            word-break: break-word;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 1.5rem;
            font-size: 0.975rem;
            line-height: 1.7;
            color: #1e293b;
        }

        .news-box a {
            color: #047857;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
            transition: color 0.15s ease;
        }

        .news-box a:hover {
            color: #064e3b;
            background-color: #ecfdf5;
        }

        /* Error Banner */
        .error-banner {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 1rem 1.25rem;
            border-radius: 10px;
            font-weight: 500;
            margin-top: 1rem;
            text-align: center;
            animation: fadeIn 0.3s ease-out forwards;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 2rem 0 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            h1 { font-size: 1.75rem; }
            .card { padding: 1.25rem; }
            .results-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                </svg>
                Planeta &amp; IA
            </div>
            <h1>Noticias climáticas del día</h1>
            <p class="subtitle">
                Explora resúmenes actualizados sobre temas ambientales y sostenibilidad, generados en tiempo real mediante inteligencia artificial.
            </p>
        </header>

        <!-- Main Form Card -->
        <main class="card">
            <form id="newsForm">
                <div class="form-group">
                    <label for="temaSelect">Selecciona un Tema Ambiental:</label>
                    <div class="select-wrapper">
                        <select id="temaSelect" required>
                            <option value="cambio climático">Cambio climático</option>
                            <option value="deforestación México">Deforestación en México</option>
                            <option value="plásticos de un solo uso">Plásticos de un solo uso</option>
                            <option value="energías renovables México">Energías renovables en México</option>
                            <option value="sequía Sinaloa">Sequía en Sinaloa</option>
                            <option value="Mazatlán medio ambiente">Mazatlán y medio ambiente</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                    <span id="btnText">Ver noticias</span>
                </button>
            </form>

            <!-- Error Banner -->
            <div id="errorBanner" class="error-banner" role="alert"></div>
        </main>

        <!-- Results Section -->
        <section id="resultsSection" class="card results-section">
            <div class="results-header">
                <h2 class="results-title">Resumen Informativo</h2>
                <span id="resultsDate" class="results-date"></span>
            </div>
            <!-- Plain text block with line break preservation -->
            <div id="newsOutput" class="news-box"></div>
        </section>

        <footer>
            Noticias climáticas del día &bull; Información ambiental impulsada por IA
        </footer>
    </div>

    <script>
        // Pega aquí la URL de tu Webhook si deseas reemplazar la existente:
        const WEBHOOK_URL = "https://hook.us2.make.com/lftvowijqfmro99t2jutqk72x3f4rkab";

        document.addEventListener("DOMContentLoaded", () => {
            const newsForm = document.getElementById("newsForm");
            const temaSelect = document.getElementById("temaSelect");
            const submitBtn = document.getElementById("submitBtn");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");
            const resultsSection = document.getElementById("resultsSection");
            const resultsDate = document.getElementById("resultsDate");
            const newsOutput = document.getElementById("newsOutput");
            const errorBanner = document.getElementById("errorBanner");

            // Returns current date nicely formatted in Spanish
            function getTodayFormattedDate() {
                const now = new Date();
                return now.toLocaleDateString("es-MX", {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });
            }

            // Converts lines starting with http or https into clickable anchors
            function processContentLines(rawText) {
                if (!rawText) return "";

                // Escape basic HTML characters for safety
                const escapeHtml = (str) => {
                    return str
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");
                };

                const lines = rawText.split(/\r?\n/);
                const processedLines = lines.map(line => {
                    const trimmedLine = line.trim();
                    const safeLine = escapeHtml(line);

                    // Check if the line starts with http:// or https://
                    if (/^https?:\/\//i.test(trimmedLine)) {
                        return safeLine.replace(/(https?:\/\/[^\s]+)/gi, (url) => {
                            return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
                        });
                    }
                    return safeLine;
                });

                return processedLines.join("\n");
            }

            newsForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const selectedTema = temaSelect.value;
                if (!selectedTema) return;

                // Hide previous output and errors
                errorBanner.style.display = "none";
                errorBanner.textContent = "";
                resultsSection.style.display = "none";

                // Update UI to loading state
                submitBtn.disabled = true;
                btnSpinner.style.display = "inline-block";
                btnText.textContent = "Buscando y resumiendo noticias...";

                // Prepare standard URLSearchParams form payload (no JSON, no custom headers)
                const bodyParams = new URLSearchParams();
                bodyParams.append("tema", selectedTema);

                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: "POST",
                        body: bodyParams
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    // Read plain text response
                    const plainTextResponse = await response.text();

                    // Update date display
                    resultsDate.textContent = getTodayFormattedDate();

                    // Parse text lines and update output
                    newsOutput.innerHTML = processContentLines(plainTextResponse);

                    // Display results box
                    resultsSection.style.display = "block";

                } catch (err) {
                    console.error("Error al consultar la noticia:", err);
                    errorBanner.textContent = "No se pudieron obtener las noticias, intenta de nuevo.";
                    errorBanner.style.display = "block";
                } finally {
                    // Restore button state
                    submitBtn.disabled = false;
                    btnSpinner.style.display = "none";
                    btnText.textContent = "Ver noticias";
                }
            });
        });
    </script>
</body>
</html>
